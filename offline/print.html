<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Print Sheet</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="page-header print-actions">
      <div>
        <h1>Print Sheet</h1>
        <p>This page updates in real time.</p>
      </div>
      <div class="actions">
        <button class="button" type="button" onclick="window.print()">
          Print
        </button>
      </div>
    </header>

    <main class="print-sheet">
      <section class="sheet-section">
        <h2>Order details</h2>
        <div class="sheet-row">
          <span>Customer</span>
          <span id="print_customer_name">-</span>
        </div>
        <div class="sheet-row">
          <span>Order number</span>
          <span id="print_order_number">-</span>
        </div>
        <div class="sheet-row">
          <span>Product</span>
          <span id="print_product">-</span>
        </div>
        <div class="sheet-row">
          <span>Quantity</span>
          <span id="print_quantity">0</span>
        </div>
        <div class="sheet-row">
          <span>Unit price</span>
          <span id="print_price">0.00</span>
        </div>
        <div class="sheet-row">
          <span>Region</span>
          <span id="print_region">local</span>
        </div>
        <div class="sheet-row">
          <span>Delivery</span>
          <span id="print_delivery">standard</span>
        </div>
        <div class="sheet-row">
          <span>Urgent</span>
          <span id="print_urgent">no</span>
        </div>
        <div class="sheet-row">
          <span>Notes</span>
          <span id="print_notes">-</span>
        </div>
      </section>

      <section class="sheet-section">
        <h2>Totals</h2>
        <div class="sheet-row">
          <span>Subtotal</span>
          <span id="print_subtotal">0.00</span>
        </div>
        <div class="sheet-row">
          <span>Discount</span>
          <span id="print_discount_amount">0.00</span>
        </div>
        <div class="sheet-row">
          <span>Delivery fee</span>
          <span id="print_delivery_fee">0.00</span>
        </div>
        <div class="sheet-row">
          <span>Urgent fee</span>
          <span id="print_urgent_fee">0.00</span>
        </div>
        <div class="sheet-row">
          <span>Tax</span>
          <span id="print_tax_amount">0.00</span>
        </div>
        <div class="sheet-row total">
          <span>Total</span>
          <span id="print_total">0.00</span>
        </div>
      </section>
    </main>

    <script src="./shared.js"></script>
    <script src="./print.js"></script>
  </body>
</html>
